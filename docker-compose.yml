services:
  api:
    build:
      context: .
      dockerfile: packages/api-service/Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5